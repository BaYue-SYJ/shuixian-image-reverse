<svg viewBox="0 0 680 428" width="680" height="428" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
<title>白模建筑海报的透视与留白结构</title>
<desc>一点透视的视平线、消失点与中轴对称关系，以及上方四成留白与金色主体建筑的位置。</desc>
<rect width="680" height="428" fill="#FFFFFF"/>
<rect x="100" y="36" width="400" height="320" fill="#F7F5F1" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="100" y="36" width="400" height="134" fill="#EFEBE4"/>
<path d="M300 170 L100 356" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<path d="M300 170 L500 356" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="100" y1="170" x2="500" y2="170" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="300" y1="36" x2="300" y2="356" stroke="#C9A227" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="240" y="186" width="120" height="48" fill="#F4ECD2"/>
<rect x="250" y="193" width="100" height="34" fill="#E3CDA3" stroke="#C9A227" stroke-width="0.5"/>
<circle cx="300" cy="170" r="3" fill="#C9A227"/>
<g>
<circle cx="122" cy="60" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="122" y="60" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">1</text>
<circle cx="482" cy="160" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="482" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">2</text>
<circle cx="316" cy="156" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="316" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">3</text>
<circle cx="316" cy="90" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="316" y="90" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">4</text>
<circle cx="370" cy="210" r="9" fill="#FFFFFF" stroke="#C9A227" stroke-width="0.5"/><text x="370" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">5</text>
<circle cx="122" cy="330" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="122" y="330" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">6</text>
</g>
<g font-size="11" fill="#444441">
<text x="40" y="388">① 上方四成是纯纸，没有细节</text>
<text x="250" y="388">② 视平线落在 42% 高度</text>
<text x="460" y="388">③ 消失点钉在中轴上</text>
<text x="40" y="410">④ 中轴一丝都不能偏</text>
<text x="250" y="410">⑤ 金色主体约占 8% 画宽</text>
<text x="460" y="410">⑥ 近景压住底边</text>
</g>
</svg>
