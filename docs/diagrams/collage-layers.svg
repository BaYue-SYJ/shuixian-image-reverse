<g>
<circle cx="52" cy="46" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="52" y="46" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">1</text>
<circle cx="52" cy="100" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="52" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">2</text>
<circle cx="101" cy="66" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="101" y="66" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">3</text>
<circle cx="52" cy="191" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="52" y="191" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">4</text>
<circle cx="56" cy="316" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="56" y="316" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">5</text>
<circle cx="257" cy="262" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="257" y="262" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">6</text>
</g>
<g>
<circle cx="306" cy="70" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="70" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">1</text>
<circle cx="306" cy="104" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="104" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">2</text>
<circle cx="306" cy="138" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">3</text>
<circle cx="306" cy="172" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">4</text>
<circle cx="306" cy="206" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="206" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">5</text>
<circle cx="306" cy="240" r="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text x="306" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">6</text>
</g>
<g font-size="12" fill="#444441">
<text x="322" y="70" dominant-baseline="central">顶字 · 撑满画宽，上沿切掉约五分之一</text>
<text x="322" y="104" dominant-baseline="central">特写 · 同一人的眼部裁切，半调网点</text>
<text x="322" y="138" dominant-baseline="central">主体 · 压在所有碎片之上，全图最清晰</text>
<text x="322" y="172" dominant-baseline="central">侧脸 · 网点更粗，整体再压暗一档</text>
<text x="322" y="206" dominant-baseline="central">标签 · 手贴纸条，打字机字，唯一暖色</text>
<text x="322" y="240" dominant-baseline="central">纸底 · 撕口露白芯，内侧带暗影</text>
</g>
<g font-size="12" fill="#888780">
<text x="306" y="286" dominant-baseline="central">右侧碎片 = 头带纹样的放大，</text>
<text x="306" y="304" dominant-baseline="central">全图唯一的红。</text>
</g>
</svg>
