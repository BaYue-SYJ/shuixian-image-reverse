<svg viewBox="0 0 680 361" width="680" height="361" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
<title>撕纸拼贴海报的碎片区域与压边层级</title>
<desc>六个元素由下到上：纸底、顶字横幅、右侧碎片、左上特写、左下侧脸、主体人物、底部标签。</desc>
<rect width="680" height="361" fill="#FFFFFF"/>
<rect x="40" y="36" width="230" height="305" fill="#E7E2DF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="40" y="36" width="230" height="61" fill="#E8EAEF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="158" y="74" text-anchor="middle" font-family="Georgia,'Noto Serif SC',serif" font-size="52" font-weight="500" fill="#5C5E6F" letter-spacing="-1">GANYU</text>
<rect x="222" y="109" width="48" height="116" fill="#C9CEDC" stroke="#FFFFFF" stroke-width="1.5"/>
<rect x="40" y="88" width="69" height="91" fill="#D2CFD3" stroke="#FFFFFF" stroke-width="1.5"/>
